<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title></head>
<body><pre id="out">RUNNING</pre>
<script>
(async () => {
  const log = [];
  try {
    const reg = await navigator.serviceWorker.register('flutter_service_worker.js?v=probe');
    log.push('registered=' + !!reg);
    await navigator.serviceWorker.ready;
    log.push('ready');
    if (!navigator.serviceWorker.controller) {
      await new Promise(r => setTimeout(r, 4000));
    }
    log.push('controller=' + !!navigator.serviceWorker.controller);
    const keys = await caches.keys();
    log.push('caches=' + keys.join(','));
    let total = 0;
    const hit = [];
    for (const k of keys) {
      const c = await caches.open(k);
      const reqs = await c.keys();
      total += reqs.length;
      for (const req of reqs) {
        const p = new URL(req.url).pathname;
        if (p.endsWith('index.html') || p.endsWith('main.dart.js') ||
            p.endsWith('canvaskit.wasm') || p.endsWith('ballroom-cjk.ttf')) {
          hit.push(p);
        }
      }
    }
    log.push('entries=' + total);
    log.push('key=' + hit.sort().join(','));
  } catch (e) {
    log.push('ERR ' + e);
  }
  document.getElementById('out').textContent = 'RESULT ' + log.join(' | ');
})();
</script>
</body></html>
